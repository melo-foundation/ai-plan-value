name: Refresh Data and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Auto-refresh data and redeploy every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Save baseline snapshot for new-model diff
        run: cp public/data/combined.json /tmp/prev-combined.json

      - name: Refresh live data from upstream sources
        id: refresh
        continue-on-error: true
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node scripts/refresh-data.mjs

      - name: Run automated site and data tests
        id: tests
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --check public/app.js && node --check scripts/refresh-data.mjs && node --check scripts/check-alerts.mjs && node scripts/test-site.mjs 2>&1 | tee /tmp/test-output.txt

      - name: Check for fetch failures, test failures, new plans, and new important models
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TESTS_OUTPUT_PATH: /tmp/test-output.txt
          PREV_SNAPSHOT_PATH: /tmp/prev-combined.json
          IMPORTANT_INTEL_THRESHOLD: "45"
        run: node scripts/check-alerts.mjs

      - name: Abort deploy if refresh or tests failed
        if: steps.refresh.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "Refresh or automated tests failed; keeping previous live Pages deployment intact."
          exit 1

      - name: Render link-preview image from fresh data
        continue-on-error: true
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttf-mscorefonts-installer fonts-wine >/dev/null
          fc-cache -f >/dev/null
          scripts/og/render.sh google-chrome

      - name: Stamp cache-busting asset versions
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          STAMP="$(date -u +%Y%m%d%H)"
          sed -i -E "s|(/og\.png)(\?v=[^\"']*)?|\1?v=${STAMP}|g" public/index.html
          sed -i -E "s|(\./styles\.css)(\?v=[^\"']*)?|\1?v=${SHORT_SHA}|g; s|(\./app\.js)(\?v=[^\"']*)?|\1?v=${SHORT_SHA}|g" public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public directory as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
