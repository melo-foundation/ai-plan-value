name: Refresh Data and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Auto-refresh data and redeploy every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh live data from upstream sources
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node scripts/refresh-data.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public directory as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
