<style>
  .filter-panel, .bar-note, .bar-plan button, .panel-head label, .titlebar-right,
  .panel-foot, #tableDetails, footer, .footnote { display: none !important; }
</style>
<script>
  // Fixed bar lengths: the top models' real bars are scaled against the whole dataset and read as noise at card size.
  (function setBars() {
    const fills = [...document.querySelectorAll(".bar-fill")];
    if (!fills.length) return setTimeout(setBars, 100);
    const W = [18, 30, 44, 60, 80];
    fills.forEach((e, i) => {
      const w = (W[i] ?? 96) + "px";
      for (const p of ["width", "min-width", "max-width"]) e.style.setProperty(p, w, "important");
      e.style.setProperty("flex", "none", "important");
    });
  })();
  // Card stamp in GMT, whatever timezone the renderer runs in.
  (function gmtStamp() {
    const el = document.getElementById("updatedAt");
    if (!el || !el.textContent.startsWith("Updated ")) return setTimeout(gmtStamp, 100);
    fetch("./data/combined.json")
      .then((r) => r.json())
      .then((ds) => {
        const d = new Date(ds.generatedAt);
        if (!Number.isFinite(d.getTime())) return;
        const stamp = d.toLocaleString("en-US", { timeZone: "UTC", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        el.textContent = `Updated ${stamp} GMT`;
      })
      .catch(() => {});
  })();
</script>
