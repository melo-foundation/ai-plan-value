<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fff; position: relative; font-family: Verdana, sans-serif; -webkit-font-smoothing: antialiased; }
  .col { position: absolute; left: 56px; top: 150px; width: 470px; }
  h1 { font-family: Verdana, sans-serif; font-weight: bold; font-size: 42px; line-height: 1.12; color: #1b3d68; letter-spacing: -1.5px; }
  h1 em { font-style: normal; background: #ffc; padding: 0 4px; margin: 0 -4px; }
  .rule { border-top: 2px dotted #8fa3b8; margin: 30px 0 24px; width: 420px; }
  .lock { display: inline-block; font-family: Verdana, sans-serif; font-weight: bold; background: linear-gradient(#3a6ea5, #1f4673); color: #fff; font-size: 30px; padding: 10px 18px 11px; text-shadow: 0 1px 0 rgba(0,0,0,.45); border: 1px solid #1a3a60; }
  .url { font-size: 19px; color: #3b5878; margin-top: 16px; }
  .shot { position: absolute; left: 560px; top: 118px; width: 700px; height: 520px; border: 1px solid #000; background: url(site2x.png) -28px -39px / 1240px auto no-repeat; }
</style>
</head>
<body>
  <div class="col">
    <h1>AI coding subscriptions, ranked by <em>real cost per task.</em></h1>
    <div class="rule"></div>
    <div class="lock">AI Plan Value</div>
    <div class="url">melo-foundation.github.io/ai-plan-value</div>
  </div>
  <div class="shot"></div>
</body>
</html>
